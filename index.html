<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aryan News Tech — Studio Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b11;--card:#101623;--border:#1e293b;--accent:#e11d48;
  --green:#10b981;--text:#f8fafc;--muted:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans','Noto Sans Devanagari',sans-serif;padding:12px;padding-bottom:70px}
.container{max-width:850px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px 0;border-bottom:1px solid var(--border);margin-bottom:16px}
.logo-box{display:flex;align-items:center;gap:10px}
.live-tag{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:#cbd5e1;margin-bottom:5px}
input,select,textarea{width:100%;background:#0b0f19;border:1px solid var(--border);border-radius:10px;padding:11px 12px;color:#fff;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:100px;resize:vertical}
.btn{background:#1e293b;color:#fff;border:1px solid var(--border);padding:11px 18px;border-radius:10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--accent);border:none;flex:1;box-shadow:0 4px 15px rgba(225,29,72,0.3)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.result-box{background:#06080d;border:1px solid var(--border);border-radius:12px;padding:16px;min-height:180px;white-space:pre-wrap;font-size:14px;line-height:1.7}
.error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:10px;border-radius:8px;font-size:12px;margin-top:10px;display:none}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-box">
      <span class="live-tag">LIVE</span>
      <div>
        <b style="font-size:16px">Aryan News Tech</b>
        <span style="font-size:11px;color:var(--muted);display:block">AI News Script Studio</span>
      </div>
    </div>
    <div style="font-size:12px;color:var(--green)">● Balance: $0.10 Active</div>
  </header>

  <div class="card">
    <div class="field">
      <label>1. APInex API Key</label>
      <input id="apiKey" type="password" placeholder="sk-apxc23e18..." autocomplete="off">
    </div>

    <div class="grid">
      <div class="field">
        <label>2. AI मॉडल (Official Free Models)</label>
        <select id="modelSelect" onchange="syncModel(this.value)">
          <optgroup label="Xiaomi MiMo (New)">
            <option value="mimo-2.6-pro" selected>mimo-2.6-pro (Telegram Featured)</option>
            <option value="mimo-2.6-flash">mimo-2.6-flash</option>
            <option value="free/mimo-2.6-pro">free/mimo-2.6-pro</option>
          </optgroup>
          <optgroup label="Gemini & Others">
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="free/gemini-2.5-flash">free/gemini-2.5-flash</option>
            <option value="free/glm-5.3-flash">free/glm-5.3-flash</option>
          </optgroup>
        </select>
      </div>

      <div class="field">
        <label>या APInex से कॉपी किया नाम यहाँ पेस्ट करें</label>
        <input id="customModel" type="text" value="mimo-2.6-pro" placeholder="उदा: mimo-2.6-pro">
      </div>
    </div>

    <div class="field">
      <label>3. खबर का विषय / हेडलाइन</label>
      <textarea id="topic" placeholder="उदाहरण: आज की टॉप 5 बड़ी राष्ट्रीय खबरें, एंकरिंग स्टाइल में तैयार करें..."></textarea>
    </div>

    <div style="display:flex;gap:10px">
      <button id="genBtn" class="btn btn-primary" onclick="generateScript()">⚡ न्यूज़ स्क्रिप्ट बनाएं</button>
      <button class="btn" onclick="copyResult()">📋 कॉपी करें</button>
    </div>

    <div id="errBox" class="error-msg"></div>
  </div>

  <div class="card">
    <label style="margin-bottom:8px">📝 टेलीप्रॉम्प्टर आउटपुट</label>
    <div id="output" class="result-box">यहाँ आपकी प्रोफेशनल न्यूज़ स्क्रिप्ट तैयार होकर आएगी...</div>
  </div>
</div>

<script>
const PROXY = "https://apinex-ai-studio.babu902654.workers.dev/v1/chat/completions";
const $ = id => document.getElementById(id);

window.onload = () => {
  const k = localStorage.getItem("apinex_key");
  if(k) $("apiKey").value = k;
};

function syncModel(val){
  $("customModel").value = val;
}

async function generateScript(){
  const key = $("apiKey").value.trim();
  const topic = $("topic").value.trim();
  const model = $("customModel").value.trim();

  if(!key) return alert("कृपया APInex API Key डालें!");
  if(!topic) return alert("कृपया खबर का विषय लिखें!");
  if(!model) return alert("कृपया मॉडल नाम लिखें!");

  localStorage.setItem("apinex_key", key);

  const btn = $("genBtn");
  const err = $("errBox");
  err.style.display = "none";
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> स्क्रिप्ट लिखी जा रही है...`;
  $("output").innerText = "AI स्क्रिप्ट तैयार कर रहा है...";

  const systemPrompt = `आप 'Aryan News Tech' के मुख्य टीवी न्यूज़ एंकर और राइटर हैं। 
नियम:
1. भाषा: प्राकृतिक, तेज और गंभीर हिंदी।
2. प्रारूप: [एंकर ऑन कैमरा], [विजुअल्स/फुटेज], [साउंड इफेक्ट/SFX] के साथ लिखें।
3. शुरुआत धमाकेदार ब्रेकिंग हेडलाइन से करें।`;

  try {
    const res = await fetch(PROXY, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + key,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: topic }
        ],
        temperature: 0.7
      })
    });

    const data = await res.json();

    if(!res.ok){
      throw new Error(data?.error?.message || data?.message || ("Error " + res.status));
    }

    const content = data?.choices?.[0]?.message?.content || data?.choices?.[0]?.text;
    if(!content) throw new Error("मॉडल से खाली उत्तर मिला।");

    $("output").innerText = content;

  } catch(e) {
    err.innerText = "⚠️ त्रुटि: " + e.message + "\n\nसुझाव: अगर यह मॉडल सब्सक्रिप्शन मांगे, तो ड्रॉपडाउन से दूसरा मॉडल (उदा: mimo-2.6-flash या free/mimo-2.6-pro) चुनें।";
    err.style.display = "block";
    $("output").innerText = "स्क्रिप्ट जनरेट नहीं हो सकी। ऊपर लाल बॉक्स में कारण देखें।";
  } finally {
    btn.disabled = false;
    btn.innerHTML = "⚡ न्यूज़ स्क्रिप्ट बनाएं";
  }
}

function copyResult(){
  navigator.clipboard.writeText($("output").innerText).then(() => alert("स्क्रिप्ट कॉपी हो गई!"));
}
</script>
</body>
</html>
